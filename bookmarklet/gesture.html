<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dust Out hand gesture</title>
<style>
  :root { --bg: #16161a; --ink: #ececec; --muted: #8a8a8a; --accent: #e2c48a; --ok: #5ad19a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  main { padding: 10px; }
  .view { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
  #status { margin-top: 8px; font-weight: 600; }
  #status.snap { color: var(--accent); }
  #status.ready { color: var(--ok); }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<main>
  <div class="view"><canvas id="cv"></canvas></div>
  <div id="status">Starting…</div>
  <div class="note" id="note">Keep this window open (it can sit behind your meeting). Snap with your hand in view.</div>
</main>
<script type="module">
// Watches your hand and tells the meeting tab that opened this window when you snap.
// A snap: thumb and middle fingertip pressed together, then the middle finger whips down to the palm.
import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
import { makeSnapDetector } from './gesture-detect.js';

const status = document.getElementById('status');
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
const set = (text, cls = '') => { status.textContent = text; status.className = cls; };

window.makeSnapDetector = makeSnapDetector; // for tests

const tell = () => {
  if (window.opener) window.opener.postMessage({ dustOut: 'snap' }, '*');
};
window.fakeSnap = tell;

if (!window.opener) document.getElementById('note').textContent = 'Open this from the Dust Out card in your meeting, so it can reach your call.';

try {
  set('Loading hand tracking…');
  const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const marker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate: 'GPU',
    },
    runningMode: 'VIDEO',
    numHands: 2,
  });
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360, frameRate: 30 } });
  const track = stream.getVideoTracks()[0];
  const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
  const detect = [window.makeSnapDetector(), window.makeSnapDetector()];
  let shownUntil = 0;
  set('Show your hand…');
  // Driven by camera frames, not animation timers, so it keeps working behind other windows.
  for (;;) {
    const { value: frame, done } = await reader.read();
    if (done) break;
    const t = performance.now();
    if (cv.width !== frame.displayWidth) { cv.width = frame.displayWidth; cv.height = frame.displayHeight; }
    cx.drawImage(frame, 0, 0);
    const res = marker.detectForVideo(frame, t);
    frame.close();
    const hands = res.landmarks || [];
    let state = hands.length ? 'hand' : 'none';
    for (let i = 0; i < 2; i++) {
      const s = detect[i](hands[i], t);
      if (s === 'snap') { state = 'snap'; tell(); shownUntil = t + 1200; }
      else if (s === 'ready' && state !== 'snap') state = 'ready';
    }
    cx.fillStyle = '#5ad19a';
    for (const h of hands) for (const p of h) cx.fillRect(p.x * cv.width - 3, p.y * cv.height - 3, 6, 6);
    if (t < shownUntil) set('Snap! Sent to your meeting.', 'snap');
    else if (state === 'ready') set('Ready… now snap', 'ready');
    else if (state === 'hand') set('Hand seen. Press thumb and middle finger together.');
    else set('Show your hand…');
  }
} catch (e) {
  set('Could not start: ' + e.message);
}
</script>
</body>
</html>
