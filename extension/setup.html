<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dust Out camera</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<main>
  <h1>Hand gesture needs your camera</h1>
  <p>Dust Out watches your hand for a finger snap. The video stays on your computer and is never saved or sent anywhere.</p>
  <p>When Chrome asks, choose <b>Allow on every visit</b>, so hand gesture keeps working after this tab closes.</p>
  <p><button id="allow">Allow camera</button></p>
  <p id="result" class="note"></p>
</main>
<script src="setup.js"></script>
</body>
</html>
